function exportWrappedPng() {
  const rows = getFilteredRows();
  const stats = computeStats(rows);
  const p = buildPersonaSummary(rows, stats);
  const dark = state.theme === "dark";

  const W = 1080, H = 1440;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");

  ctx.fillStyle = dark ? "#0c0e12" : "#f6f4ef";
  ctx.fillRect(0, 0, W, H);
  const grad = ctx.createRadialGradient(W * 0.85, H * 0.14, 40, W * 0.85, H * 0.14, 620);
  grad.addColorStop(0, dark ? "rgba(232,93,63,0.28)" : "rgba(201,71,43,0.16)");
  grad.addColorStop(1, "transparent");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const textMain = dark ? "#f3f1ec" : "#1b1b1d";
  const textMute = dark ? "#9aa0ad" : "#5d616b";
  const cardBg = dark ? "#181c24" : "#ffffff";
  const border = dark ? "rgba(255,255,255,0.10)" : "rgba(20,20,20,0.10)";
  const accent = dark ? "#e85d3f" : "#c9472b";
  const accent2 = dark ? "#f0a542" : "#d68516";

  const roundRect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.arc(92, 104, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = textMain;
  ctx.font = "800 42px sans-serif";
  ctx.fillText("lens-note · " + (state.lang === "zh" ? "镜头笔记" : "Photo Recap"), 122, 118);

  ctx.fillStyle = accent2;
  ctx.font = "700 32px sans-serif";
  ctx.fillText(p.scopeLabel, 80, 186);

  const bigCards = [
    [state.burstFold ? tr("kpiShots") : tr("kpiShotsRaw"), stats.total.toLocaleString(), textMain],
    [tr("kpiKeepers"), stats.keepers.toLocaleString(), accent2],
    [tr("colRate"), stats.rate.toFixed(1) + "%", accent]
  ];
  bigCards.forEach(([k, v, col], idx) => {
    const bx = 80 + idx * 314, by = 240, bw = 294, bh = 185;
    roundRect(bx, by, bw, bh, 22);
    ctx.fillStyle = cardBg; ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = textMute; ctx.font = "600 24px sans-serif";
    ctx.fillText(k, bx + 28, by + 56);
    ctx.fillStyle = col; ctx.font = "800 58px monospace";
    ctx.fillText(v, bx + 28, by + 138);
  });

  ctx.fillStyle = textMute; ctx.font = "600 24px sans-serif";
  ctx.fillText(state.lang === "zh" ? "年度摄影关键词" : "PHOTOGRAPHER TAGS", 80, 495);
  let tx = 80, ty = 528;
  ctx.font = "700 26px sans-serif";
  p.tags.forEach(tg => {
    const tw = ctx.measureText(tg).width + 48;
    if (tx + tw > W - 80) { tx = 80; ty += 66; }
    roundRect(tx, ty, tw, 50, 25);
    ctx.fillStyle = dark ? "rgba(232,93,63,0.18)" : "rgba(201,71,43,0.12)";
    ctx.fill();
    ctx.fillStyle = accent2;
    ctx.fillText(tg, tx + 24, ty + 34);
    tx += tw + 16;
  });

  const details = [
    [tr("wFavoriteFocal"), p.topFocal],
    [tr("wMvpGear"), p.mvpGear],
    [tr("wPeakDay"), p.peakOuting],
    [tr("wShutterWindow"), p.goldenWindow]
  ];
  details.forEach(([k, v], idx) => {
    const col = idx % 2, row = Math.floor(idx / 2);
    const bx = 80 + col * 470, by = 710 + row * 195, bw = 450, bh = 170;
    roundRect(bx, by, bw, bh, 22);
    ctx.fillStyle = cardBg; ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = textMute; ctx.font = "600 24px sans-serif";
    ctx.fillText(k, bx + 28, by + 54);
    ctx.fillStyle = textMain; ctx.font = "700 32px sans-serif";
    let disp = String(v);
    while (ctx.measureText(disp).width > bw - 56 && disp.length > 4) disp = disp.slice(0, -2) + "…";
    ctx.fillText(disp, bx + 28, by + 118);
  });

  roundRect(80, 1125, 920, 175, 22);
  ctx.fillStyle = cardBg; ctx.fill();
  ctx.strokeStyle = border; ctx.stroke();
  ctx.fillStyle = textMain; ctx.font = "600 28px sans-serif";
  const line1 = state.lang === "zh"
    ? `活跃拍摄 ${stats.activeDays} 天 · 跨度 ${DATA.years.join(" / ") || "-"}`
    : `${stats.activeDays} Active Days · Years: ${DATA.years.join(" / ") || "-"}`;
  ctx.fillText(line1, 114, 1196);
  ctx.fillStyle = textMute; ctx.font = "500 24px sans-serif";
  ctx.fillText("lens-note · 100% Offline Photography Analytics", 114, 1252);

  const a = document.createElement("a");
  a.download = `lens-note_${p.scopeLabel.replace(/[^\w\u4e00-\u9fa5-]+/g, "_")}.png`;
  a.href = c.toDataURL("image/png");
  a.click();
}

function renderAll() {
  renderControls();
  renderSectionHeaders();
  const rowsBase = getFilteredRows(true);
  const rows = getFilteredRows(false);
  const stats = computeStats(rows);
  const lensSvc = computeLensServiceStats(rowsBase);

  renderKPIs(stats);
  renderTrend(rows);
  renderCalendar(rows);
  renderFocalChart(rows);
  renderQuadrant(rowsBase, lensSvc);
  renderLensTimeline(lensSvc);
  renderRankings(rowsBase, stats, lensSvc);
  renderHourChart(rows);
  renderOrient(rows);
  renderWrapped(rows, stats);
  renderHealthFooter();
}

document.getElementById("yearSelect").addEventListener("change", e => {
  state.year = e.target.value;
  if (state.year !== "ALL") state.calYear = state.year;
  state.outing = "ALL";
  state.dateStr = null;
  renderAll();
});
document.getElementById("monthSelect").addEventListener("change", e => {
  state.month = e.target.value;
  state.outing = "ALL";
  state.dateStr = null;
  renderAll();
});
document.getElementById("outingSelect").addEventListener("change", e => {
  state.outing = e.target.value;
  state.dateStr = null;
  renderAll();
});
document.getElementById("minSamplesSelect").addEventListener("change", e => {
  state.minSamples = Number(e.target.value);
  renderAll();
});
document.getElementById("btnBurstFold").addEventListener("click", () => {
  state.burstFold = !state.burstFold;
  renderAll();
});
document.getElementById("btnTheme").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  savePref("ln_theme", state.theme);
  renderAll();
});
document.getElementById("btnLang").addEventListener("click", () => {
  state.lang = state.lang === "zh" ? "en" : "zh";
  savePref("ln_lang", state.lang);
  renderAll();
});
document.getElementById("btnReset").addEventListener("click", () => {
  state.year = "ALL";
  state.month = "ALL";
  state.outing = "ALL";
  state.gear = "ALL";
  state.thresh = 1;
  state.burstFold = true;
  state.lensIdx = null;
  state.dateStr = null;
  renderAll();
});
document.getElementById("btnExportPng").addEventListener("click", exportWrappedPng);

renderAll();
</script>
</body>
</html>
