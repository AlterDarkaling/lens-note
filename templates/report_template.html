<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lens-note · 镜头笔记</title>
<style>
:root {
  --bg: #0c0e12;
  --bg-elev: #14171e;
  --bg-card: #181c24;
  --bg-hover: #202531;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --text: #f3f1ec;
  --text-muted: #9aa0ad;
  --text-dim: #686f7d;
  --accent: #e85d3f;
  --accent-2: #f0a542;
  --accent-soft: rgba(232,93,63,0.16);
  --bar-muted: rgba(255,255,255,0.12);
  --bar-muted-hover: rgba(255,255,255,0.22);
  --heat-0: #1b2029;
  --heat-1: #4d2c22;
  --heat-2: #8a3f28;
  --heat-3: #c74f2f;
  --heat-4: #f0a542;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --radius: 14px;
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html[data-theme="light"] {
  --bg: #f6f4ef;
  --bg-elev: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #efece4;
  --border: rgba(20,20,20,0.09);
  --border-strong: rgba(20,20,20,0.18);
  --text: #1b1b1d;
  --text-muted: #5d616b;
  --text-dim: #8a8e98;
  --accent: #c9472b;
  --accent-2: #d68516;
  --accent-soft: rgba(201,71,43,0.11);
  --bar-muted: rgba(20,20,20,0.09);
  --bar-muted-hover: rgba(20,20,20,0.17);
  --heat-0: #ebe8e0;
  --heat-1: #f4cbbd;
  --heat-2: #e79980;
  --heat-3: #d46243;
  --heat-4: #b8381d;
  --shadow: 0 8px 24px rgba(30,25,18,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s ease, color 0.2s ease;
}
.container { max-width: 1360px; margin: 0 auto; padding: 18px 22px 48px; }
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 11px 22px;
}
.topbar-inner { max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }
.topbar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark {
  font-weight: 800; font-size: 1.22rem; letter-spacing: -0.02em;
  display: inline-flex; align-items: center; gap: 8px;
}
.brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 10px var(--accent); }
.brand-sub { font-size: 0.8rem; color: var(--text-muted); max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.btn, .pill {
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text);
  border-radius: 8px;
  padding: 5px 11px;
  font-size: 0.79rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover, .pill:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filter-label { font-size: 0.74rem; color: var(--text-dim); letter-spacing: 0.03em; }
select {
  background: var(--bg-elev); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px; font-size: 0.79rem; font-family: inherit; outline: none;
  cursor: pointer;
}
select:focus { border-color: var(--accent); }
.chip-active {
  background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.kpi-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px;
}
.kpi-card.clickable { cursor: pointer; }
.kpi-card.clickable:hover { border-color: var(--accent); transform: translateY(-1px); }
.kpi-title { font-size: 0.75rem; color: var(--text-muted); }
.kpi-value { font-size: 1.48rem; font-weight: 800; font-family: var(--mono); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-value.sm { font-size: 1.02rem; font-family: var(--sans); line-height: 1.3; white-space: normal; }
.kpi-sub { font-size: 0.74rem; color: var(--text-dim); }
.kpi-accent { color: var(--accent-2); }
.grid-focal-quad { display: grid; grid-template-columns: 1fr 1.25fr; gap: 16px; margin-bottom: 16px; }
.grid-time { display: grid; grid-template-columns: 1fr 1.15fr; gap: 16px; margin-bottom: 16px; }
.grid-closing { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; margin-bottom: 16px; }
.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
  min-width: 0;
}
.card .svg-wrap { flex: 1; display: flex; align-items: center; }
.card-full { margin-bottom: 16px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.card-title { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
.card-desc { font-size: 0.78rem; color: var(--text-muted); }
.seg { display: inline-flex; background: var(--bg); padding: 3px; border-radius: 9px; border: 1px solid var(--border); gap: 2px; flex-wrap: wrap; }
.seg button {
  border: none; background: transparent; color: var(--text-muted); padding: 4px 9px;
  font-size: 0.76rem; border-radius: 6px; cursor: pointer; font-family: inherit;
}
.seg button.active { background: var(--bg-hover); color: var(--text); font-weight: 600; }
.svg-wrap { width: 100%; overflow-x: auto; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.legend-row { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.76rem; color: var(--text-muted); align-items: center; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.table-wrap { overflow-x: auto; max-height: 410px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
th {
  position: sticky; top: 0; background: var(--bg-card); z-index: 2;
  text-align: left; font-size: 0.74rem; color: var(--text-muted); font-weight: 600;
  padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap;
}
td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr.clickable-row { cursor: pointer; }
tr.clickable-row:hover td { background: var(--bg-hover); }
tr.active-row td { background: var(--accent-soft); }
.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
.rate-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.rate-track { width: 76px; height: 6px; border-radius: 99px; background: var(--bar-muted); overflow: hidden; }
.rate-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.orient-bar { height: 14px; border-radius: 999px; overflow: hidden; display: flex; background: var(--bar-muted); }
.orient-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.orient-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 4px; }
.orient-box .lbl { font-size: 0.76rem; color: var(--text-muted); }
.orient-box .big { font-size: 1.18rem; font-weight: 800; font-family: var(--mono); }
.orient-mini-track { height: 4px; border-radius: 99px; background: var(--bar-muted); overflow: hidden; margin-top: 2px; }
.orient-mini-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.orient-insight { font-size: 0.78rem; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; }
#orientWrap { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.wrapped-box {
  background: radial-gradient(circle at 85% 15%, var(--accent-soft), transparent 55%), var(--bg-card);
  border: 1px solid var(--border-strong);
}
.persona-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: center; }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.tag {
  padding: 5px 12px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
  background: var(--accent-soft); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent-2) 35%, transparent);
}
.wrapped-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.wstat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.wstat-k { font-size: 0.74rem; color: var(--text-muted); }
.wstat-v { font-size: 1.05rem; font-weight: 700; margin-top: 2px; word-break: break-word; }
.health-footer {
  margin-top: 20px; padding: 14px 18px; border-radius: var(--radius);
  background: var(--bg-elev); border: 1px solid var(--border);
  font-size: 0.76rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between;
}
.tooltip {
  position: fixed; z-index: 100; pointer-events: none; display: none;
  background: var(--bg-elev); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 9px 12px; font-size: 0.78rem; box-shadow: var(--shadow); max-width: 280px;
}
.tooltip b { color: var(--accent-2); }
.empty-msg { padding: 36px 16px; text-align: center; color: var(--text-muted); font-size: 0.88rem; }
.status-badge {
  display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 0.7rem; font-weight: 600;
  white-space: nowrap; border: 1px solid transparent;
}
.st-workhorse { background: rgba(232,93,63,0.16); color: var(--accent); border-color: rgba(232,93,63,0.35); }
.st-new { background: rgba(240,165,66,0.16); color: var(--accent-2); border-color: rgba(240,165,66,0.38); }
.st-active { background: rgba(72,187,120,0.14); color: #48bb78; border-color: rgba(72,187,120,0.32); }
.st-dust { background: rgba(154,160,173,0.14); color: var(--text-muted); border-color: rgba(154,160,173,0.28); }
.st-retired { background: var(--bar-muted); color: var(--text-dim); border-color: var(--border); }
.st-trial { background: rgba(99,179,237,0.14); color: #63b3ed; border-color: rgba(99,179,237,0.3); }
.quad-svg.has-hover .quad-node { opacity: 0.3; transition: opacity 0.15s ease; }
.quad-svg.has-hover .quad-node.is-hovered, .quad-svg.has-hover .quad-node.is-selected { opacity: 1; }
@media (max-width: 1120px) {
  .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-focal-quad, .grid-time, .grid-closing, .persona-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .container { padding: 12px 12px 36px; }
  .topbar { padding: 10px 12px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark"><span class="brand-dot"></span><span>lens-note</span><span id="brandSubTitle" style="font-weight:500;font-size:0.92rem;color:var(--text-muted)"></span></span>
        <span class="brand-sub" id="rootsLabel"></span>
      </div>
      <div class="actions">
        <button class="pill" id="btnBurstFold" type="button"></button>
        <button class="btn" id="btnReset" type="button"></button>
        <button class="btn" id="btnTheme" type="button"></button>
        <button class="btn" id="btnLang" type="button"></button>
        <button class="btn btn-primary" id="btnExportPng" type="button"></button>
      </div>
    </div>
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label" id="lblYear"></span>
        <select id="yearSelect"></select>
      </div>
      <div class="filter-group">
        <span class="filter-label" id="lblMonth"></span>
        <select id="monthSelect"></select>
      </div>
      <div class="filter-group">
        <span class="filter-label" id="lblOuting"></span>
        <select id="outingSelect" style="max-width:230px"></select>
      </div>
      <div class="filter-group" id="gearSegGroup">
        <span class="filter-label" id="lblGear"></span>
        <div class="seg" id="gearSeg"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label" id="lblThresh"></span>
        <div class="seg" id="threshSeg"></div>
      </div>
      <div id="activeChips" class="filter-group"></div>
    </div>
  </div>
</header>

<main class="container">
  <section class="kpi-grid" id="kpiGrid"></section>

  <section class="card card-full">
    <div class="card-head">
      <div>
        <div class="card-title" id="tCalendar"></div>
        <div class="card-desc" id="dCalendar"></div>
      </div>
      <div class="seg" id="calYearTabs"></div>
    </div>
    <div class="svg-wrap" id="calendarChart"></div>
  </section>

  <section class="grid-focal-quad">
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title" id="tFocal"></div>
          <div class="card-desc" id="dFocal"></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <div class="seg" id="focalModeSeg"></div>
          <div class="seg" id="focalGroupSeg"></div>
        </div>
      </div>
      <div class="svg-wrap" id="focalChart"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title" id="tQuad"></div>
          <div class="card-desc" id="dQuad"></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <div class="seg" id="quadModeSeg"></div>
          <div class="seg" id="quadFilterSeg"></div>
        </div>
      </div>
      <div class="svg-wrap" id="quadChart"></div>
      <div class="legend-row" id="quadLegend"></div>
    </div>
  </section>

  <section class="card card-full">
    <div class="card-head">
      <div>
        <div class="card-title" id="tTimeline"></div>
        <div class="card-desc" id="dTimeline"></div>
      </div>
      <div class="seg" id="timelineSortSeg"></div>
    </div>
    <div class="svg-wrap" id="timelineChart"></div>
  </section>

  <section class="card card-full">
    <div class="card-head">
      <div>
        <div class="card-title" id="tRank"></div>
        <div class="card-desc" id="dRank"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <div class="seg" id="rankTabSeg"></div>
        <div class="seg" id="rankSortSeg"></div>
        <label style="font-size:0.78rem;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px">
          <span id="lblMinSamples"></span>
          <select id="minSamplesSelect">
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>
    </div>
    <div class="table-wrap" id="rankTableWrap"></div>
  </section>

  <section class="grid-time">
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title" id="tTrend"></div>
          <div class="card-desc" id="dTrend"></div>
        </div>
        <div class="legend-row" id="legendTrend"></div>
      </div>
      <div class="svg-wrap" id="trendChart"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title" id="tHour"></div>
          <div class="card-desc" id="dHour"></div>
        </div>
        <div class="legend-row" id="legendHour"></div>
      </div>
      <div class="svg-wrap" id="hourChart"></div>
    </div>
  </section>

  <section class="grid-closing">
    <section class="card wrapped-box" id="wrappedSection"></section>
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title" id="tOrient"></div>
          <div class="card-desc" id="dOrient"></div>
        </div>
      </div>
      <div id="orientWrap"></div>
    </div>
  </section>

  <footer class="health-footer" id="healthFooter"></footer>
</main>

<div class="tooltip" id="tooltip"></div>

<script>

function loadPref(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}
function savePref(key, val) {
  try { localStorage.setItem(key, val); } catch (e) {}
}

const PRESENT_GEAR_CODES = (() => {
  const s = new Set();
  for (let i = 0; i < DATA.rows.length; i++) s.add(DATA.rows[i][5]);
  return [0, 1, 2, 3, 4].filter(c => s.has(c));
})();

const state = {
  lang: loadPref("ln_lang", DEFAULT_LANG) === "en" ? "en" : "zh",
  theme: loadPref("ln_theme", "dark") === "light" ? "light" : "dark",
  year: "ALL",
  month: "ALL",
  outing: "ALL",
  gear: "ALL",
  thresh: 1,
  burstFold: true,
  lensIdx: null,
  dateStr: null,
  calYear: DATA.years.length ? DATA.years[DATA.years.length - 1] : "",
  focalMode: "eq35",
  focalGroup: "buckets",
  quadMode: "usage",
  quadScope: "main",
  timelineSort: "first",
  rankTab: "lens",
  rankSort: "rate",
  minSamples: 10
};

function tr(key, ...args) {
  let s = (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
  args.forEach((v, i) => { s = s.replace("{" + i + "}", v); });
  return s;
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}
function effRating(row) {
  return state.burstFold ? row[12] : row[8];
}
function effPick(row) {
  return state.burstFold ? row[13] : row[9];
}
function isKeeper(row, thresh) {
  const r = effRating(row), pk = effPick(row);
  if (thresh <= 1) return r >= 1 || pk === 1;
  return r >= thresh;
}
function lensDisplay(idx) {
  const obj = DATA.lenses[idx];
  return (obj && obj.name) ? obj.name : tr("unknownLens");
}

const DATE_YM = DATA.dates.map(d => d.slice(0, 7));
const DATE_Y = DATA.dates.map(d => d.slice(0, 4));
const DATE_M = DATA.dates.map(d => d.slice(5, 7));

function gearFilterCode() {
  return state.gear === "camera" ? 0 : state.gear === "drone" ? 1 : state.gear === "gimbal" ? 2 : state.gear === "action" ? 3 : state.gear === "phone" ? 4 : -1;
}

function getFilteredRows(ignoreLensAndDate = false) {
  const gc = gearFilterCode();
  const out = [];
  for (let i = 0; i < DATA.rows.length; i++) {
    const r = DATA.rows[i];
    if (state.burstFold && r[11] === 0) continue;
    if (gc !== -1 && r[5] !== gc) continue;
    if (state.year !== "ALL" && DATE_Y[r[0]] !== state.year) continue;
    if (state.month !== "ALL" && DATE_M[r[0]] !== state.month) continue;
    if (state.outing !== "ALL" && r[2] !== Number(state.outing)) continue;
    if (!ignoreLensAndDate) {
      if (state.lensIdx !== null && r[4] !== state.lensIdx) continue;
      if (state.dateStr !== null && DATA.dates[r[0]] !== state.dateStr) continue;
    }
    out.push(r);
  }
  return out;
}

const tooltipEl = document.getElementById("tooltip");
function showTip(ev, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.style.display = "block";
  const pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + 280 > window.innerWidth) x = ev.clientX - 280;
  if (y + 140 > window.innerHeight) y = ev.clientY - 120;
  tooltipEl.style.left = Math.max(8, x) + "px";
  tooltipEl.style.top = Math.max(8, y) + "px";
}
function hideTip() { tooltipEl.style.display = "none"; }
function bindTip(svgContainer) {
  svgContainer.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => showTip(e, el.getAttribute("data-tip")));
    el.addEventListener("mouseleave", hideTip);
  });
}

function renderControls() {
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";

  document.getElementById("brandSubTitle").textContent = tr("brandSub");
  const roots = (DATA.health && DATA.health.scanned_roots) || [];
  document.getElementById("rootsLabel").textContent = roots.join(" + ");
  document.getElementById("btnReset").textContent = tr("reset");
  document.getElementById("btnTheme").textContent = state.theme === "dark" ? ("☀️ " + tr("themeLight")) : ("🌙 " + tr("themeDark"));
  document.getElementById("btnLang").textContent = state.lang === "zh" ? "EN" : "中文";
  document.getElementById("btnExportPng").textContent = "📷 " + tr("exportPng");

  const foldedCnt = (DATA.health && DATA.health.burst_folded_shots) || 0;
  const bBtn = document.getElementById("btnBurstFold");
  bBtn.className = "pill" + (state.burstFold ? " active" : "");
  bBtn.textContent = tr("burstFold") + (foldedCnt > 0 ? ` (${foldedCnt})` : "");
  bBtn.title = tr("burstFoldTip", foldedCnt);

  document.getElementById("lblYear").textContent = tr("year");
  document.getElementById("lblMonth").textContent = tr("month");
  document.getElementById("lblOuting").textContent = tr("outing");
  document.getElementById("lblGear").textContent = tr("gear");
  document.getElementById("lblThresh").textContent = tr("thresh");

  const gc = gearFilterCode();

  // Year select
  const yCounts = {};
  let yTotal = 0;
  for (let i = 0; i < DATA.rows.length; i++) {
    const r = DATA.rows[i];
    if (state.burstFold && r[11] === 0) continue;
    if (gc !== -1 && r[5] !== gc) continue;
    const y = DATE_Y[r[0]];
    yCounts[y] = (yCounts[y] || 0) + 1;
    yTotal++;
  }
  const ySel = document.getElementById("yearSelect");
  ySel.innerHTML = "";
  const yAllOpt = document.createElement("option");
  yAllOpt.value = "ALL";
  yAllOpt.textContent = `${tr("allYears")} (${yTotal.toLocaleString()})`;
  ySel.appendChild(yAllOpt);
  DATA.years.forEach(y => {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = `${y} (${(yCounts[y] || 0).toLocaleString()})`;
    ySel.appendChild(opt);
  });
  ySel.value = state.year;

  // Month select (only months with >0 shots or currently selected)
  const mCounts = new Array(13).fill(0);
  let mTotal = 0;
  for (let i = 0; i < DATA.rows.length; i++) {
    const r = DATA.rows[i];
    if (state.burstFold && r[11] === 0) continue;
    if (gc !== -1 && r[5] !== gc) continue;
    if (state.year !== "ALL" && DATE_Y[r[0]] !== state.year) continue;
    const m = Number(DATE_M[r[0]]);
    if (m >= 1 && m <= 12) mCounts[m]++;
    mTotal++;
  }
  const mSel = document.getElementById("monthSelect");
  mSel.innerHTML = "";
  const mAllOpt = document.createElement("option");
  mAllOpt.value = "ALL";
  mAllOpt.textContent = `${tr("allMonths")} (${mTotal.toLocaleString()})`;
  mSel.appendChild(mAllOpt);
  for (let m = 1; m <= 12; m++) {
    const ms = String(m).padStart(2, "0");
    if (mCounts[m] === 0 && state.month !== ms) continue;
    const opt = document.createElement("option");
    opt.value = ms;
    opt.textContent = `${tr("monthFmt", ms)} (${mCounts[m].toLocaleString()})`;
    mSel.appendChild(opt);
  }
  mSel.value = state.month;

  // Outing select
  const outShotCounts = new Array(DATA.outings.length).fill(0);
  for (let i = 0; i < DATA.rows.length; i++) {
    const r = DATA.rows[i];
    if (state.burstFold && r[11] === 0) continue;
    if (gc !== -1 && r[5] !== gc) continue;
    if (state.year !== "ALL" && DATE_Y[r[0]] !== state.year) continue;
    if (state.month !== "ALL" && DATE_M[r[0]] !== state.month) continue;
    outShotCounts[r[2]]++;
  }
  const oSel = document.getElementById("outingSelect");
  oSel.innerHTML = "";
  const optAll = document.createElement("option");
  optAll.value = "ALL";
  optAll.textContent = tr("allOutings");
  oSel.appendChild(optAll);
  DATA.outings.forEach((o, idx) => {
    if (outShotCounts[idx] === 0 && String(idx) !== String(state.outing)) return;
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = `${o.name} (${outShotCounts[idx]})`;
    oSel.appendChild(opt);
  });
  oSel.value = state.outing;

  // Dynamic Gear Type selector (hide absent types; hide whole group if <=1 type)
  const gGroup = document.getElementById("gearSegGroup");
  const gSeg = document.getElementById("gearSeg");
  if (PRESENT_GEAR_CODES.length <= 1) {
    gGroup.style.display = "none";
  } else {
    gGroup.style.display = "flex";
    gSeg.innerHTML = "";
    const codeMap = {
      0: ["camera", "gearCam"],
      1: ["drone", "gearDrone"],
      2: ["gimbal", "gearGimbal"],
      3: ["action", "gearAction"],
      4: ["phone", "gearPhone"]
    };
    const opts = [["ALL", "gearAll"], ...PRESENT_GEAR_CODES.map(c => codeMap[c])];
    opts.forEach(([v, k]) => {
      const b = document.createElement("button");
      b.className = state.gear === v ? "active" : "";
      b.textContent = tr(k);
      b.onclick = () => { state.gear = v; renderAll(); };
      gSeg.appendChild(b);
    });
  }

  // Threshold segmented
  const tSeg = document.getElementById("threshSeg");
  tSeg.innerHTML = "";
  [[1, "th1"], [2, "th2"], [3, "th3"], [4, "th4"], [5, "th5"]].forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.thresh === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => { state.thresh = v; renderAll(); };
    tSeg.appendChild(b);
  });

  // Active chips
  const chips = document.getElementById("activeChips");
  chips.innerHTML = "";
  if (state.lensIdx !== null) {
    const c = document.createElement("button");
    c.className = "chip-active";
    c.innerHTML = `${escHtml(tr("lensChip") + lensDisplay(state.lensIdx))} <span>×</span>`;
    c.onclick = () => { state.lensIdx = null; renderAll(); };
    chips.appendChild(c);
  }
  if (state.dateStr !== null) {
    const c = document.createElement("button");
    c.className = "chip-active";
    c.innerHTML = `${escHtml(tr("dateChip") + state.dateStr)} <span>×</span>`;
    c.onclick = () => { state.dateStr = null; renderAll(); };
    chips.appendChild(c);
  }
}

  `;
  document.getElementById("legendTrend").innerHTML = legHtml;
  document.getElementById("legendHour").innerHTML = legHtml;
}

function computeStats(rows) {
  const total = rows.length;
  let keepers = 0;
  const activeDates = new Set();
  const outingsMap = new Map();
  const lensMap = new Map();
  const camMap = new Map();
  const focal35Counts = new Map();
  let focalTagged = 0;

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const k = isKeeper(r, state.thresh);
    const rt = effRating(r);
    if (k) keepers++;
    activeDates.add(r[0]);

    const oi = r[2];
    let om = outingsMap.get(oi);
    if (!om) { om = { shots: 0, keepers: 0, starSum: 0, ratedCnt: 0, focal: new Map() }; outingsMap.set(oi, om); }
    om.shots++;
    if (k) om.keepers++;
    if (rt > 0) { om.starSum += rt; om.ratedCnt++; }

    const li = r[4];
    let lm = lensMap.get(li);
    if (!lm) { lm = { shots: 0, keepers: 0, starSum: 0, ratedCnt: 0, focal: new Map() }; lensMap.set(li, lm); }
    lm.shots++;
    if (k) lm.keepers++;
    if (rt > 0) { lm.starSum += rt; lm.ratedCnt++; }

    const ci = r[3];
    let cm = camMap.get(ci);
    if (!cm) { cm = { shots: 0, keepers: 0, starSum: 0, ratedCnt: 0, focal: new Map() }; camMap.set(ci, cm); }
    cm.shots++;
    if (k) cm.keepers++;
    if (rt > 0) { cm.starSum += rt; cm.ratedCnt++; }

    if (r[6] && r[6] > 0) {
      const fl = Math.round(r[6]);
      focalTagged++;
      focal35Counts.set(fl, (focal35Counts.get(fl) || 0) + 1);
      lm.focal.set(fl, (lm.focal.get(fl) || 0) + 1);
      cm.focal.set(fl, (cm.focal.get(fl) || 0) + 1);
      om.focal.set(fl, (om.focal.get(fl) || 0) + 1);
    }
  }

  let topFocal = null, topFocalCnt = 0;
  focal35Counts.forEach((c, fl) => { if (c > topFocalCnt) { topFocalCnt = c; topFocal = fl; } });

  let mvpLens = null, mvpScore = -1;
  lensMap.forEach((m, li) => {
    if (DATA.lenses[li] && DATA.lenses[li].name === "" && lensMap.size > 1) return;
    if (m.keepers > mvpScore || (m.keepers === mvpScore && mvpLens && (m.keepers / m.shots) > (mvpLens.keepers / mvpLens.shots))) {
      mvpScore = m.keepers;
      mvpLens = { idx: li, ...m };
    }
  });
  if (!mvpLens && lensMap.size > 0) {
    const first = lensMap.entries().next().value;
    mvpLens = { idx: first[0], ...first[1] };
  }

  let peakOuting = null;
  outingsMap.forEach((m, oi) => {
    if (!peakOuting || m.keepers > peakOuting.keepers || (m.keepers === peakOuting.keepers && m.shots > peakOuting.shots)) {
      peakOuting = { idx: oi, ...m };
    }
  });

  return {
    total, keepers,
    rate: total ? (keepers / total * 100) : 0,
    activeDays: activeDates.size,
    avgPerOuting: outingsMap.size ? (total / outingsMap.size) : 0,
    topFocal, topFocalPct: focalTagged ? (topFocalCnt / focalTagged * 100) : 0,
    mvpLens, peakOuting,
    outingsMap, lensMap, camMap
  };
}

function renderDualAxisBars(container, items, opts = {}) {
  if (!items.length) {
    container.innerHTML = `<div class="empty-msg">${tr("noData")}</div>`;
    return;
  }
  const W = opts.width || 680, H = opts.height || 240;
  const padL = 42, padR = 40, padT = 18, padB = 34;
  const pw = W - padL - padR, ph = H - padT - padB;
  const maxShots = Math.max(1, ...items.map(d => d.shots));
  const maxRate = Math.max(20, ...items.map(d => d.rate));
  const step = pw / items.length;
  const bw = Math.max(8, Math.min(44, step * 0.6));

  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  if (opts.bandsHtml) svg += opts.bandsHtml(padL, padT, pw, ph, step);

  for (let g = 0; g <= 4; g++) {
    const y = padT + ph - (ph * g / 4);
    const val = Math.round(maxShots * g / 4);
    const rVal = Math.round(maxRate * g / 4);
    svg += `<line x1="${padL}" y1="${y}" x2="${padL + pw}" y2="${y}" stroke="var(--border)" stroke-dasharray="3,3"/>`;
    svg += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--text-dim)" font-family="var(--mono)">${val}</text>`;
    svg += `<text x="${padL + pw + 6}" y="${y + 4}" text-anchor="start" font-size="10" fill="var(--accent-2)" font-family="var(--mono)">${rVal}%</text>`;
  }

  const pts = [];
  items.forEach((d, i) => {
    const cx = padL + step * (i + 0.5);
    const bh = (d.shots / maxShots) * ph;
    const kh = (d.keepers / maxShots) * ph;
    const yAll = padT + ph - bh;
    const yKeep = padT + ph - kh;
    const ry = padT + ph - (d.rate / maxRate) * ph;
    pts.push(`${cx.toFixed(1)},${ry.toFixed(1)}`);

    const tip = escHtml(`<b>${d.title || d.label}</b><br/>${tr("legShots")}: ${d.shots}<br/>${tr("legKeepers")}: ${d.keepers}<br/>${tr("legRate")}: ${d.rate.toFixed(1)}%`);
    const clickAttr = d.clickVal ? ` data-click="${escHtml(d.clickVal)}" style="cursor:pointer"` : "";
    svg += `<g data-tip="${tip}"${clickAttr}>`;
    svg += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${yAll.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(--bar-muted-hover)"/>`;
    if (kh > 0) {
      svg += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${yKeep.toFixed(1)}" width="${bw.toFixed(1)}" height="${kh.toFixed(1)}" rx="3" fill="var(--accent)"/>`;
    }
    if (!opts.labelSkip || i % opts.labelSkip === 0) {
      svg += `<text x="${cx.toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="${opts.fontSize || 10}" fill="var(--text-muted)">${escHtml(d.label)}</text>`;
    }
    svg += `</g>`;
  });

  if (pts.length > 1) {
    svg += `<polyline fill="none" stroke="var(--accent-2)" stroke-width="2" points="${pts.join(" ")}"/>`;
  }
  items.forEach((d, i) => {
    const cx = padL + step * (i + 0.5);
    const ry = padT + ph - (d.rate / maxRate) * ph;
    svg += `<circle cx="${cx.toFixed(1)}" cy="${ry.toFixed(1)}" r="3.2" fill="var(--accent-2)" stroke="var(--bg-card)" stroke-width="1.2" pointer-events="none"/>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;
  bindTip(container);
  if (opts.onClick) {
    container.querySelectorAll("[data-click]").forEach(el => {
      el.addEventListener("click", () => opts.onClick(el.getAttribute("data-click")));
    });
  }
}

function renderTrend(rows) {
  const ymMap = new Map();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];

    let m = ymMap.get(ym);
    if (!m) { m = { shots: 0, keepers: 0 }; ymMap.set(ym, m); }
    m.shots++;

  }
  const keys = Array.from(ymMap.keys()).sort();
  const items = keys.map(ym => {
    const m = ymMap.get(ym);
    return {
      label: keys.length > 12 ? ym.slice(2) : ym.slice(5),

function renderCalendar(rows) {
  const tabs = document.getElementById("calYearTabs");
  tabs.innerHTML = "";
  const years = DATA.years;
  if (!years.includes(state.calYear) && years.length) state.calYear = years[years.length - 1];
  years.forEach(y => {
    const b = document.createElement("button");
    b.className = state.calYear === y ? "active" : "";
    b.textContent = y;
    b.onclick = () => { state.calYear = y; renderCalendar(rows); };
    tabs.appendChild(b);
  });

  const container = document.getElementById("calendarChart");
  if (!state.calYear) {
    container.innerHTML = `<div class="empty-msg">${tr("noData")}</div>`;
    return;
  }

  const dayMap = new Map();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const ds = DATA.dates[r[0]];
    if (!ds.startsWith(state.calYear + "-")) continue;
    let d = dayMap.get(ds);
    if (!d) { d = { shots: 0, keepers: 0, outing: DATA.outings[r[2]].name }; dayMap.set(ds, d); }
    d.shots++;
    if (isKeeper(r, state.thresh)) d.keepers++;
  }

  const yNum = Number(state.calYear);
  const jan1 = new Date(Date.UTC(yNum, 0, 1));
  const dec31 = new Date(Date.UTC(yNum, 11, 31));
  const startDow = jan1.getUTCDay();
  const maxDayShots = Math.max(1, ...Array.from(dayMap.values()).map(d => d.shots));

  const cell = 16, gap = 4, step = cell + gap;
  const padL = 30, padT = 24;
  const weeks = Math.ceil(((dec31 - jan1) / 86400000 + 1 + startDow) / 7);
  const W = padL + weeks * step + 12;
  const H = padT + 7 * step + 26;

  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  const monthSeen = new Set();
  for (let dt = new Date(jan1); dt <= dec31; dt.setUTCDate(dt.getUTCDate() + 1)) {
    const dayOfYear = Math.round((dt - jan1) / 86400000);
    const totalIdx = dayOfYear + startDow;
    const wk = Math.floor(totalIdx / 7);
    const dow = totalIdx % 7;
    const x = padL + wk * step;
    const y = padT + dow * step;

    const mo = dt.getUTCMonth() + 1;
    if (!monthSeen.has(mo) && dt.getUTCDate() <= 7) {
      monthSeen.add(mo);
      svg += `<text x="${x}" y="${padT - 8}" font-size="11" fill="var(--text-dim)" font-family="var(--mono)">${String(mo).padStart(2, "0")}</text>`;
    }

    const ds = dt.toISOString().slice(0, 10);
    const info = dayMap.get(ds);
    let fill = "var(--heat-0)";
    if (info) {
      const ratio = info.shots / maxDayShots;
      fill = ratio > 0.75 ? "var(--heat-4)" : ratio > 0.45 ? "var(--heat-3)" : ratio > 0.2 ? "var(--heat-2)" : "var(--heat-1)";
    }
    const isSel = state.dateStr === ds;
    const stroke = isSel ? `stroke="var(--text)" stroke-width="1.8"` : "";
    if (info) {
      const rate = (info.keepers / info.shots * 100).toFixed(1);
      const tip = escHtml(`<b>${ds}</b> (${info.outing})<br/>${tr("legShots")}: ${info.shots}<br/>${tr("legKeepers")}: ${info.keepers} (${rate}%)`);
      svg += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3.5" fill="${fill}" ${stroke} data-tip="${tip}" data-date="${ds}" style="cursor:pointer"/>`;
    } else {
      svg += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3.5" fill="${fill}"/>`;
    }
  }
  ["M", "W", "F"].forEach((lbl, idx) => {
    const dow = [1, 3, 5][idx];
    svg += `<text x="6" y="${padT + dow * step + 12}" font-size="10.5" fill="var(--text-dim)" font-family="var(--mono)">${lbl}</text>`;
  });
  const lx = W - 146, ly = H - 15;
  svg += `<text x="${lx - 8}" y="${ly + 10}" text-anchor="end" font-size="10.5" fill="var(--text-dim)">${tr("less")}</text>`;
  [0, 1, 2, 3, 4].forEach((lv, i) => {
    svg += `<rect x="${lx + i * 18}" y="${ly}" width="13" height="13" rx="2.5" fill="var(--heat-${lv})"/>`;
  });
  svg += `<text x="${lx + 96}" y="${ly + 10}" font-size="10.5" fill="var(--text-dim)">${tr("more")}</text>`;
  svg += `</svg>`;
  container.innerHTML = svg;
  bindTip(container);
  container.querySelectorAll("[data-date]").forEach(el => {
    el.addEventListener("click", () => {
      const ds = el.getAttribute("data-date");
      state.dateStr = (state.dateStr === ds) ? null : ds;
      renderAll();
    });
  });
}

// 7-tier industry standard 35mm equivalent FOV buckets
const STD_BUCKETS = [
  { id: "ultra", key: "bUltra", max: 20 },
  { id: "wide", key: "bWide", max: 30 },
  { id: "street", key: "bStreet", max: 44 },
  { id: "std", key: "bStd", max: 64 },
  { id: "port", key: "bPort", max: 115 },
  { id: "tele", key: "bTele", max: 250 },
  { id: "super", key: "bSuper", max: Infinity }
];

function focalBucketId(mm) {
  for (let i = 0; i < STD_BUCKETS.length; i++) {
    if (mm <= STD_BUCKETS[i].max) return STD_BUCKETS[i].id;
  }
  return "super";
}

function renderFocalChart(rows) {
  const mSeg = document.getElementById("focalModeSeg");
  mSeg.innerHTML = "";
  [["eq35", "eq35"], ["phys", "physMm"]].forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.focalMode === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => { state.focalMode = v; renderFocalChart(rows); };
    mSeg.appendChild(b);
  });

  const gSeg = document.getElementById("focalGroupSeg");
  gSeg.innerHTML = "";
  [["buckets", "buckets"], ["exact", "exactMm"]].forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.focalGroup === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => { state.focalGroup = v; renderFocalChart(rows); };
    gSeg.appendChild(b);
  });

  const idxField = state.focalMode === "eq35" ? 6 : 7;
  const map = new Map();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const fl = r[idxField];
    if (!fl || fl <= 0) continue;
    const key = state.focalGroup === "buckets" ? focalBucketId(fl) : String(Math.round(fl));
    let m = map.get(key);
    if (!m) { m = { shots: 0, keepers: 0 }; map.set(key, m); }
    m.shots++;
    if (isKeeper(r, state.thresh)) m.keepers++;
  }

  let items = [];
  if (state.focalGroup === "buckets") {
    STD_BUCKETS.forEach(bk => {
      const m = map.get(bk.id);
      if (m) {
        const lbl = tr(bk.key);
        items.push({ label: lbl, title: lbl + " mm", shots: m.shots, keepers: m.keepers, rate: m.keepers / m.shots * 100 });
      }
    });
  } else {
    const topExact = Array.from(map.entries())
      .sort((a, b) => b[1].shots - a[1].shots)
      .slice(0, 16)
      .sort((a, b) => Number(a[0]) - Number(b[0]));
    items = topExact.map(([mm, m]) => ({
      label: mm + "mm", title: mm + " mm", shots: m.shots, keepers: m.keepers, rate: m.keepers / m.shots * 100
    }));
  }
  renderDualAxisBars(document.getElementById("focalChart"), items, { width: 520, height: 320, fontSize: 10.5 });
}

function computeLensServiceStats(rows) {
  const gearDates = new Map();
  const gearDateShots = new Map();
  const lensMap = new Map();
  let minDate = null, maxDate = null;

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const d = DATA.dates[r[0]];
    if (!minDate || d < minDate) minDate = d;
    if (!maxDate || d > maxDate) maxDate = d;

    const gt = r[5];
    if (!gearDates.has(gt)) gearDates.set(gt, new Set());
    gearDates.get(gt).add(d);
    if (!gearDateShots.has(gt)) gearDateShots.set(gt, new Map());
    const gd = gearDateShots.get(gt);
    gd.set(d, (gd.get(d) || 0) + 1);

    const li = r[4];
    let lm = lensMap.get(li);
    if (!lm) {
      lm = {
        idx: li,
        name: lensDisplay(li),
        shots: 0, keepers: 0, starSum: 0, ratedCnt: 0,
        datesSet: new Set(), gearsSet: new Set(),
        focal: new Map(), monthStats: new Map()
      };
      lensMap.set(li, lm);
    }
    const k = isKeeper(r, state.thresh);
    const rt = effRating(r);
    lm.shots++;
    if (k) lm.keepers++;
    if (rt > 0) { lm.starSum += rt; lm.ratedCnt++; }
    lm.datesSet.add(d);
    lm.gearsSet.add(gt);
    if (r[6] && r[6] > 0) {
      const fl = Math.round(r[6]);
      lm.focal.set(fl, (lm.focal.get(fl) || 0) + 1);
    }
    const ym = d.slice(0, 7);
    let ms = lm.monthStats.get(ym);
    if (!ms) { ms = { shots: 0, keepers: 0 }; lm.monthStats.set(ym, ms); }
    ms.shots++;
    if (k) ms.keepers++;
  }

  const totalRows = rows.length;
  const items = new Map();

  lensMap.forEach((lm, li) => {
    const sortedDates = Array.from(lm.datesSet).sort();
    const firstDate = sortedDates[0];
    const lastDate = sortedDates[sortedDates.length - 1];
    const usedDays = sortedDates.length;

    const spanDates = new Set();
    const afterDates = new Set();
    let spanTotalShots = 0;

    lm.gearsSet.forEach(gt => {
      const gDates = gearDates.get(gt);
      const gShots = gearDateShots.get(gt);
      if (!gDates) return;
      gDates.forEach(d => {
        if (d >= firstDate && d <= lastDate) {
          spanDates.add(d);
          spanTotalShots += (gShots.get(d) || 0);
        } else if (d > lastDate) {
          afterDates.add(d);
        }
      });
    });

    const spanDays = spanDates.size;
    const afterDays = afterDates.size;
    const dayRate = spanDays > 0 ? Math.min(100, usedDays / spanDays * 100) : 0;
    const shotRate = spanTotalShots > 0 ? Math.min(100, lm.shots / spanTotalShots * 100) : 0;
    const globalShare = totalRows > 0 ? (lm.shots / totalRows * 100) : 0;
    const rate = lm.shots > 0 ? (lm.keepers / lm.shots * 100) : 0;
    const qualifiedUsage = (spanDays >= 3 && usedDays >= 2);

    let status = "dust";
    if (usedDays <= 1) status = "trial";
    else if (afterDays >= 20) status = "retired";
    else if (spanDays <= 12 && afterDays <= 6) status = "new";
    else if (dayRate >= 45) status = "workhorse";
    else if (dayRate >= 25) status = "active";

    let topFocal = "-";
    let bestF = 0;
    lm.focal.forEach((c, fl) => { if (c > bestF) { bestF = c; topFocal = fl + "mm"; } });

    items.set(li, {
      idx: li,
      name: lm.name,
      shots: lm.shots,
      keepers: lm.keepers,
      rate,
      avgStar: lm.ratedCnt ? (lm.starSum / lm.ratedCnt).toFixed(1) : "-",
      topFocal,
      firstDate,
      lastDate,
      usedDays,
      spanDays,
      spanTotalShots,
      afterDays,
      dayRate,
      shotRate,
      globalShare,
      qualifiedUsage,
      status,
      monthStats: lm.monthStats
    });
  });

  return { minDate, maxDate, items };
}

function shortLensLabel(name) {
  if (!name) return tr("unknownLens");
  if (/E-Mount,\s*T-Mount/i.test(name)) return state.lang === "zh" ? "E口手动/转接" : "E-Mount Manual";
  let s = name
    .replace(/\|.*$/i, "")
    .replace(/\b(DC OS|IS STM|OSS|DG DN|DI III|VC USD|VXD|G2|A063|B070)\b/gi, "")
    .replace(/\s+/g, " ")
    .trim();
  if (s.length > 17) s = s.slice(0, 16).trim() + "…";
  return s;
}

function renderQuadrant(rows, lensSvc) {
  const qSeg = document.getElementById("quadModeSeg");
  qSeg.innerHTML = "";
  [["usage", "quadModeUsage"], ["share", "quadModeShare"]].forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.quadMode === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => {
      state.quadMode = v;
      document.getElementById("dQuad").textContent = v === "usage" ? tr("dQuadUsage") : tr("dQuadShare");
      renderQuadrant(rows, lensSvc);
    };
    qSeg.appendChild(b);
  });

  const fSeg = document.getElementById("quadFilterSeg");
  fSeg.innerHTML = "";
  [["main", "quadScopeMain"], ["all", "quadScopeAll"]].forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.quadScope === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => {
      state.quadScope = v;
      renderQuadrant(rows, lensSvc);
    };
    fSeg.appendChild(b);
  });

  const container = document.getElementById("quadChart");
  const legBox = document.getElementById("quadLegend");
  const total = rows.length;
  if (!total) {
    container.innerHTML = `<div class="empty-msg">${tr("noData")}</div>`;
    legBox.innerHTML = "";
    return;
  }

  const allItems = Array.from(lensSvc.items.values());
  const minMain = total >= 2000 ? 100 : total >= 400 ? 30 : 5;
  const multiDayCnt = allItems.filter(it => it.usedDays > 1 && it.shots >= 3).length;

  let pts = allItems.filter(it => {
    if (state.quadScope === "main" && it.shots < minMain) return false;
    if (state.quadScope === "all" && it.shots < 3 && allItems.length > 4) return false;
    if (state.quadMode === "usage" && multiDayCnt >= 3 && it.usedDays <= 1) return false;
    return true;
  });
  if (pts.length < 3) {
    pts = allItems.filter(it => (state.quadMode === "usage" && multiDayCnt >= 3) ? it.usedDays > 1 : true);
    if (!pts.length) pts = allItems;
  }

  const xOf = p => state.quadMode === "usage" ? p.dayRate : p.globalShare;
  const maxRawX = Math.max(10, ...pts.map(xOf));
  const maxX = state.quadMode === "usage"
    ? Math.min(100, Math.max(60, Math.ceil(maxRawX / 10) * 10 + 10))
    : Math.min(100, Math.max(20, Math.ceil(maxRawX / 10) * 10 + 5));
  const maxRawRate = Math.max(12, ...pts.map(p => p.rate));
  const maxRate = Math.min(100, Math.max(20, Math.ceil(maxRawRate / 5) * 5 + 5));

  const sortedX = pts.map(xOf).sort((a, b) => a - b);
  const mid = Math.floor(sortedX.length / 2);
  const medX = sortedX.length % 2 ? sortedX[mid] : (sortedX[mid - 1] + sortedX[mid]) / 2;
  const refX = Math.max(maxX * 0.18, Math.min(maxX * 0.82, medX));

  const sumShots = pts.reduce((a, p) => a + p.shots, 0);
  const sumKeep = pts.reduce((a, p) => a + p.keepers, 0);
  const weightedY = sumShots > 0 ? (sumKeep / sumShots * 100) : 0;
  const refY = Math.max(maxRate * 0.16, Math.min(maxRate * 0.84, weightedY));
  const maxKeep = Math.max(1, ...pts.map(p => p.keepers));

  const W = 680, H = 318, padL = 48, padR = 24, padT = 26, padB = 38;
  const pw = W - padL - padR, ph = H - padT - padB;
  const inPad = 14;
  const plotX0 = padL + inPad, plotW = pw - 2 * inPad;
  const plotY0 = padT + inPad, plotH = ph - 2 * inPad;
  const sx = v => plotX0 + Math.max(0, Math.min(1, v / maxX)) * plotW;
  const sy = v => plotY0 + plotH - Math.max(0, Math.min(1, v / maxRate)) * plotH;

  const ax = sx(refX), ay = sy(refY);

  let svg = `<svg class="chart quad-svg" viewBox="0 0 ${W} ${H}">`;

  // 4 semantic quadrant background tints
  svg += `<rect x="${ax.toFixed(1)}" y="${padT}" width="${(padL + pw - ax).toFixed(1)}" height="${(ay - padT).toFixed(1)}" fill="rgba(56,178,114,0.08)"/>`;
  svg += `<rect x="${padL}" y="${padT}" width="${(ax - padL).toFixed(1)}" height="${(ay - padT).toFixed(1)}" fill="rgba(240,165,66,0.07)"/>`;
  svg += `<rect x="${ax.toFixed(1)}" y="${ay.toFixed(1)}" width="${(padL + pw - ax).toFixed(1)}" height="${(padT + ph - ay).toFixed(1)}" fill="rgba(232,93,63,0.06)"/>`;
  svg += `<rect x="${padL}" y="${ay.toFixed(1)}" width="${(ax - padL).toFixed(1)}" height="${(padT + ph - ay).toFixed(1)}" fill="rgba(154,160,173,0.05)"/>`;

  // Y grid + ticks
  for (let g = 0; g <= 4; g++) {
    const valY = maxRate * g / 4;
    const y = sy(valY);
    svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL + pw}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-dasharray="2,3"/>`;
    svg += `<text x="${padL - 7}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-dim)" font-family="var(--mono)">${Math.round(valY)}%</text>`;
  }
  // X grid + ticks
  for (let g = 0; g <= 4; g++) {
    const valX = maxX * g / 4;
    const x = sx(valX);
    svg += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT + ph}" stroke="var(--border)" stroke-dasharray="2,3"/>`;
    svg += `<text x="${x.toFixed(1)}" y="${padT + ph + 15}" text-anchor="middle" font-size="10" fill="var(--text-dim)" font-family="var(--mono)">${Math.round(valX)}%</text>`;
  }

  // Outer frame
  svg += `<rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" fill="none" stroke="var(--border-strong)" stroke-width="1"/>`;

  // Reference crosshairs
  svg += `<line x1="${ax.toFixed(1)}" y1="${padT}" x2="${ax.toFixed(1)}" y2="${padT + ph}" stroke="var(--border-strong)" stroke-width="1.2" stroke-dasharray="4,4"/>`;
  svg += `<line x1="${padL}" y1="${ay.toFixed(1)}" x2="${padL + pw}" y2="${ay.toFixed(1)}" stroke="var(--border-strong)" stroke-width="1.2" stroke-dasharray="4,4"/>`;

  // Reference pills on top and right edges
  const xPillTxt = tr("quadAvgX", refX.toFixed(0));
  const yPillTxt = tr("quadAvgY", weightedY.toFixed(1));
  svg += `<text x="${ax.toFixed(1)}" y="${padT - 7}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--text-muted)">${escHtml(xPillTxt)}</text>`;
  svg += `<text x="${padL + pw - 5}" y="${(ay - 5).toFixed(1)}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--text-muted)">${escHtml(yPillTxt)}</text>`;

  // Corner quadrant titles & subtitles
  svg += `<text x="${padL + pw - 10}" y="${padT + 17}" text-anchor="end" font-size="11" font-weight="700" fill="#38b272" opacity="0.9">${tr("qTopRight")}</text>`;
  svg += `<text x="${padL + pw - 10}" y="${padT + 30}" text-anchor="end" font-size="9" fill="var(--text-muted)" opacity="0.8">${tr("qSubTopRight")}</text>`;

  svg += `<text x="${padL + 10}" y="${padT + 17}" text-anchor="start" font-size="11" font-weight="700" fill="var(--accent-2)" opacity="0.9">${tr("qTopLeft")}</text>`;
  svg += `<text x="${padL + 10}" y="${padT + 30}" text-anchor="start" font-size="9" fill="var(--text-muted)" opacity="0.8">${tr("qSubTopLeft")}</text>`;

  svg += `<text x="${padL + pw - 10}" y="${padT + ph - 19}" text-anchor="end" font-size="11" font-weight="700" fill="var(--accent)" opacity="0.9">${tr("qBotRight")}</text>`;
  svg += `<text x="${padL + pw - 10}" y="${padT + ph - 7}" text-anchor="end" font-size="9" fill="var(--text-muted)" opacity="0.8">${tr("qSubBotRight")}</text>`;

  svg += `<text x="${padL + 10}" y="${padT + ph - 19}" text-anchor="start" font-size="11" font-weight="700" fill="var(--text-muted)" opacity="0.9">${tr("qBotLeft")}</text>`;
  svg += `<text x="${padL + 10}" y="${padT + ph - 7}" text-anchor="start" font-size="9" fill="var(--text-dim)" opacity="0.85">${tr("qSubBotLeft")}</text>`;

  // Precompute bubble nodes
  const nodes = pts.map(p => {
    const xv = xOf(p);
    const cx = sx(xv);
    const cy = sy(p.rate);
    const rad = 7 + Math.sqrt(p.keepers / maxKeep) * 17;
    const isRight = xv >= refX;
    const isTop = p.rate >= refY;
    const qColor = (isRight && isTop) ? "#38b272"
      : (!isRight && isTop) ? "var(--accent-2)"
      : (isRight && !isTop) ? "var(--accent)"
      : "var(--text-muted)";
    return { p, cx, cy, rad, isRight, isTop, qColor, label: shortLensLabel(p.name) };
  });

  // 2D collision-free label placement (highest keepers first)
  const labelOrder = [...nodes].sort((a, b) => b.p.keepers - a.p.keepers || b.p.shots - a.p.shots);
  const placedBoxes = [];
  const cornerZones = [
    { x1: padL + 4, y1: padT + 4, x2: padL + 115, y2: padT + 36 },
    { x1: padL + pw - 115, y1: padT + 4, x2: padL + pw - 4, y2: padT + 36 },
    { x1: padL + 4, y1: padT + ph - 36, x2: padL + 115, y2: padT + ph - 4 },
    { x1: padL + pw - 115, y1: padT + ph - 36, x2: padL + pw - 4, y2: padT + ph - 4 }
  ];

  const boxOverlap = (a, b, margin = 3) => !(a.x2 + margin <= b.x1 || b.x2 + margin <= a.x1 || a.y2 + margin <= b.y1 || b.y2 + margin <= a.y1);
  const boxCirclePen = (box, nx, ny, nr) => {
    const nearX = Math.max(box.x1, Math.min(nx, box.x2));
    const nearY = Math.max(box.y1, Math.min(ny, box.y2));
    const d2 = (nearX - nx) * (nearX - nx) + (nearY - ny) * (nearY - ny);
    const rr = nr + 2.5;
    if (d2 >= rr * rr) return 0;
    return (rr - Math.sqrt(d2));
  };

  const labelPlacements = new Map();
  const rings = [6, 18, 34, 52];
  const dirs = [
    [0, -1], [0.85, -0.55], [-0.85, -0.55], [1, 0], [-1, 0], [0.85, 0.55], [-0.85, 0.55], [0, 1],
    [0.5, -0.87], [-0.5, -0.87], [0.5, 0.87], [-0.5, 0.87]
  ];

  labelOrder.forEach(n => {
    const lw = Math.min(130, Math.max(38, n.label.length * 6.3 + 12));
    const lh = 16;
    let bestBox = null, bestScore = Infinity;

    for (let ri = 0; ri < rings.length; ri++) {
      const dist = n.rad + rings[ri];
      for (let di = 0; di < dirs.length; di++) {
        const [dx, dy] = dirs[di];
        const axPt = n.cx + dx * dist;
        const ayPt = n.cy + dy * dist;

        let bx1 = dx > 0.25 ? axPt : dx < -0.25 ? axPt - lw : axPt - lw / 2;
        let by1 = dy > 0.25 ? ayPt : dy < -0.25 ? ayPt - lh : ayPt - lh / 2;

        bx1 = Math.max(padL + 3, Math.min(padL + pw - lw - 3, bx1));
        by1 = Math.max(padT + 3, Math.min(padT + ph - lh - 3, by1));
        const cand = { x1: bx1, y1: by1, x2: bx1 + lw, y2: by1 + lh, w: lw, h: lh };

        let score = rings[ri] * 0.85;
        for (let pi = 0; pi < placedBoxes.length; pi++) {
          if (boxOverlap(cand, placedBoxes[pi], 3)) score += 100000;
        }
        for (let ni = 0; ni < nodes.length; ni++) {
          const other = nodes[ni];
          const pen = boxCirclePen(cand, other.cx, other.cy, other.rad);
          if (pen > 0) score += 1500 + pen * 300;
        }
        for (let ci = 0; ci < cornerZones.length; ci++) {
          if (boxOverlap(cand, cornerZones[ci], 0)) score += 380;
        }
        if (cand.x1 < ax && cand.x2 > ax) score += 45;
        if (cand.y1 < ay && cand.y2 > ay) score += 45;

        if (score < bestScore) {
          bestScore = score;
          bestBox = cand;
        }
      }
      if (bestScore < 100) break;
    }

    placedBoxes.push(bestBox);
    labelPlacements.set(n.p.idx, bestBox);
  });

  // Draw bubbles largest-to-smallest so small bubbles inside clusters stay interactive on top
  const drawOrder = [...nodes].sort((a, b) => b.rad - a.rad);
  const qCounts = { tr: 0, tl: 0, br: 0, bl: 0 };

  drawOrder.forEach(n => {
    const { p, cx, cy, rad, isRight, isTop, qColor, label } = n;
    if (isRight && isTop) qCounts.tr++;
    else if (!isRight && isTop) qCounts.tl++;
    else if (isRight && !isTop) qCounts.br++;
    else qCounts.bl++;

    const isSel = state.lensIdx === p.idx;
    const isRet = p.status === "retired";
    const statusLbl = tr("status_" + p.status);
    const tip = escHtml(
      `<b>${p.name}</b> (${statusLbl})<br/>` +
      `${tr("spanTipFmt", p.firstDate, p.lastDate, p.usedDays, p.spanDays, p.dayRate.toFixed(1), p.shotRate.toFixed(1), p.afterDays)}<br/>` +
      `${tr("colShots")}: ${p.shots} (${p.globalShare.toFixed(1)}%) · ${tr("colKeepers")}: ${p.keepers} (${p.rate.toFixed(1)}%)`
    );

    const box = labelPlacements.get(p.idx);
    const bcx = (box.x1 + box.x2) / 2;
    const bcy = (box.y1 + box.y2) / 2;
    const nearX = Math.max(box.x1, Math.min(cx, box.x2));
    const nearY = Math.max(box.y1, Math.min(cy, box.y2));
    const edgeGap = Math.hypot(nearX - cx, nearY - cy) - rad;

    svg += `<g class="quad-node${isSel ? " is-selected" : ""}" data-tip="${tip}" data-lens="${p.idx}" style="cursor:pointer">`;
    if (edgeGap > 6) {
      const ang = Math.atan2(nearY - cy, nearX - cx);
      const lx1 = cx + Math.cos(ang) * (rad + 1.5);
      const ly1 = cy + Math.sin(ang) * (rad + 1.5);
      svg += `<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${nearX.toFixed(1)}" y2="${nearY.toFixed(1)}" stroke="var(--border-strong)" stroke-width="1"/>`;
    }
    svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="${qColor}" fill-opacity="${isRet ? (isSel ? 0.55 : 0.25) : (isSel ? 0.94 : 0.76)}" stroke="${isSel ? "var(--text)" : isRet ? qColor : "var(--bg-card)"}" stroke-width="${isSel ? 2.4 : isRet ? 1.6 : 1.4}"${isRet ? ' stroke-dasharray="4,2.5"' : ""}/>`;
    svg += `<rect x="${box.x1.toFixed(1)}" y="${box.y1.toFixed(1)}" width="${box.w.toFixed(1)}" height="${box.h.toFixed(1)}" rx="4" fill="var(--bg-card)" fill-opacity="0.88" stroke="${isSel ? qColor : "var(--border)"}" stroke-width="${isSel ? 1.2 : 0.8}"/>`;
    svg += `<text x="${bcx.toFixed(1)}" y="${(bcy + 3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="${isSel ? 700 : 500}" fill="var(--text)">${escHtml(label)}</text>`;
    svg += `</g>`;
  });

  const xLbl = state.quadMode === "usage" ? tr("xUsageLabel") : tr("xShareLabel");
  svg += `<text x="${padL + pw / 2}" y="${H - 5}" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">${xLbl}</text>`;
  svg += `</svg>`;
  container.innerHTML = svg;
  bindTip(container);

  const svgEl = container.querySelector(".quad-svg");
  container.querySelectorAll(".quad-node").forEach(el => {
    el.addEventListener("mouseenter", () => {
      if (svgEl) svgEl.classList.add("has-hover");
      el.classList.add("is-hovered");
    });
    el.addEventListener("mouseleave", () => {
      el.classList.remove("is-hovered");
      if (svgEl) svgEl.classList.remove("has-hover");
    });
    el.addEventListener("click", () => {
      const li = Number(el.getAttribute("data-lens"));
      state.lensIdx = (state.lensIdx === li) ? null : li;
      renderAll();
    });
  });

  legBox.innerHTML = `
    <span class="legend-item"><span class="swatch" style="background:#38b272;border-radius:50%"></span>${tr("qTopRight")} (${qCounts.tr})</span>
    <span class="legend-item"><span class="swatch" style="background:var(--accent-2);border-radius:50%"></span>${tr("qTopLeft")} (${qCounts.tl})</span>
    <span class="legend-item"><span class="swatch" style="background:var(--accent);border-radius:50%"></span>${tr("qBotRight")} (${qCounts.br})</span>
    <span class="legend-item"><span class="swatch" style="background:var(--text-muted);border-radius:50%"></span>${tr("qBotLeft")} (${qCounts.bl})</span>
    <span class="legend-item" style="margin-left:auto">${tr("quadLegSize")} · ${tr("quadLegActive")} · ${tr("quadLegRetired")}</span>
  `;
}

function renderLensTimeline(lensSvc) {
  const sSeg = document.getElementById("timelineSortSeg");
  sSeg.innerHTML = "";
  [["first", "tlSortFirst"], ["usage", "tlSortUsage"], ["shots", "tlSortShots"]].forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.timelineSort === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => { state.timelineSort = v; renderLensTimeline(lensSvc); };
    sSeg.appendChild(b);
  });

  const container = document.getElementById("timelineChart");
  const all = Array.from(lensSvc.items.values());
  if (!all.length || !lensSvc.minDate) {
    container.innerHTML = `<div class="empty-msg">${tr("noData")}</div>`;
    return;
  }

  let list = all.length > 6 ? all.filter(it => it.shots >= 3) : all;
  if (!list.length) list = all;

  list.sort((a, b) => {
    if (state.timelineSort === "usage") {
      return (b.qualifiedUsage ? 1 : 0) - (a.qualifiedUsage ? 1 : 0) || b.dayRate - a.dayRate || b.shots - a.shots;
    }
    if (state.timelineSort === "shots") {
      return b.shots - a.shots || b.dayRate - a.dayRate;
    }
    return a.firstDate.localeCompare(b.firstDate) || b.shots - a.shots;
  });
  list = list.slice(0, 20);

  let minMs = Date.parse(lensSvc.minDate + "T00:00:00Z");
  let maxMs = Date.parse(lensSvc.maxDate + "T00:00:00Z");
  if (maxMs <= minMs) {
    minMs -= 15 * 86400000;
    maxMs += 15 * 86400000;
  }
  const spanMs = Math.max(86400000, maxMs - minMs);

  const W = 1260, leftW = 240, rightW = 196, plotW = W - leftW - rightW;
  const rowH = 30, padT = 26, padB = 10;
  const H = padT + list.length * rowH + padB;
  const xOfDate = ds => leftW + ((Date.parse(ds + "T00:00:00Z") - minMs) / spanMs) * plotW;

  // Monthly vertical ticks
  const startDt = new Date(minMs);
  let curY = startDt.getUTCFullYear(), curM = startDt.getUTCMonth();
  const ticks = [];
  for (let guard = 0; guard < 120; guard++) {
    const ms = Date.UTC(curY, curM, 1);
    if (ms > maxMs) break;
    if (ms >= minMs) {
      ticks.push({
        x: leftW + ((ms - minMs) / spanMs) * plotW,
        label: String(curY).slice(2) + "-" + String(curM + 1).padStart(2, "0")
      });
    }
    curM++;
    if (curM > 11) { curM = 0; curY++; }
  }
  const tickStep = ticks.length > 14 ? Math.ceil(ticks.length / 12) : 1;

  let maxMonthShots = 1;
  list.forEach(it => it.monthStats.forEach(ms => { if (ms.shots > maxMonthShots) maxMonthShots = ms.shots; }));

  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  ticks.forEach((tk, i) => {
    svg += `<line x1="${tk.x.toFixed(1)}" y1="${padT}" x2="${tk.x.toFixed(1)}" y2="${H - padB}" stroke="var(--border)" stroke-dasharray="2,3"/>`;
    if (i % tickStep === 0) {
      svg += `<text x="${tk.x.toFixed(1)}" y="${padT - 8}" text-anchor="middle" font-size="10" fill="var(--text-dim)" font-family="var(--mono)">${tk.label}</text>`;
    }
  });

  const statusColor = st => (st === "workhorse" || st === "new") ? "var(--accent)" : st === "active" ? "#48bb78" : st === "trial" ? "#63b3ed" : "var(--text-dim)";

  list.forEach((it, idx) => {
    const y = padT + idx * rowH;
    const cy = y + rowH / 2;
    const isSel = state.lensIdx === it.idx;
    const col = statusColor(it.status);
    const shortName = it.name.length > 26 ? it.name.slice(0, 24) + "…" : it.name;
    const x1 = xOfDate(it.firstDate);
    const x2 = xOfDate(it.lastDate);
    const statusLbl = tr("status_" + it.status);
    const laneTip = escHtml(
      `<b>${it.name}</b> (${statusLbl})<br/>` +
      `${tr("spanTipFmt", it.firstDate, it.lastDate, it.usedDays, it.spanDays, it.dayRate.toFixed(1), it.shotRate.toFixed(1), it.afterDays)}<br/>` +
      `${tr("colShots")}: ${it.shots} · ${tr("colKeepers")}: ${it.keepers} (${it.rate.toFixed(1)}%)`
    );

    svg += `<g data-lens="${it.idx}" style="cursor:pointer">`;
    if (isSel) {
      svg += `<rect x="4" y="${y + 2}" width="${W - 8}" height="${rowH - 4}" rx="8" fill="var(--accent-soft)"/>`;
    }
    svg += `<line x1="${leftW}" y1="${cy}" x2="${leftW + plotW}" y2="${cy}" stroke="var(--border)" stroke-width="1"/>`;
    svg += `<text x="${leftW - 12}" y="${cy + 4}" text-anchor="end" font-size="11.5" font-weight="${isSel ? 700 : 500}" fill="${isSel ? "var(--accent-2)" : "var(--text)"}" data-tip="${laneTip}">${escHtml(shortName)}</text>`;

    if (it.usedDays <= 1 || x2 - x1 < 4) {
      svg += `<circle cx="${x1.toFixed(1)}" cy="${cy}" r="5.5" fill="none" stroke="${col}" stroke-width="2" data-tip="${laneTip}"/>`;
    } else {
      svg += `<rect x="${x1.toFixed(1)}" y="${(cy - 3).toFixed(1)}" width="${Math.max(4, x2 - x1).toFixed(1)}" height="6" rx="3" fill="${col}" fill-opacity="0.32" data-tip="${laneTip}"/>`;
    }

    it.monthStats.forEach((ms, ym) => {
      let midDs = ym + "-15";
      if (midDs < lensSvc.minDate) midDs = lensSvc.minDate;
      if (midDs > lensSvc.maxDate) midDs = lensSvc.maxDate;
      const mx = xOfDate(midDs);
      const mr = 3.2 + Math.sqrt(ms.shots / maxMonthShots) * 6.5;
      const mRate = ms.shots ? (ms.keepers / ms.shots * 100).toFixed(1) : "0.0";
      const mTip = escHtml(`<b>${it.name} · ${ym}</b><br/>${tr("colShots")}: ${ms.shots}<br/>${tr("colKeepers")}: ${ms.keepers} (${mRate}%)`);
      svg += `<circle cx="${mx.toFixed(1)}" cy="${cy}" r="${mr.toFixed(1)}" fill="${col}" fill-opacity="0.88" stroke="var(--bg-card)" stroke-width="1" data-tip="${mTip}"/>`;
    });

    const rightPct = it.usedDays <= 1 ? tr("trialBadge") : (it.dayRate.toFixed(0) + "%");
    svg += `<text x="${leftW + plotW + 14}" y="${cy + 4}" font-size="11.5" font-weight="700" font-family="var(--mono)" fill="var(--text)" data-tip="${laneTip}">${escHtml(rightPct)}</text>`;
    svg += `<text x="${leftW + plotW + 76}" y="${cy + 4}" font-size="11" font-weight="600" fill="${col}" data-tip="${laneTip}">${escHtml(statusLbl)}</text>`;
    svg += `</g>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;
  bindTip(container);
  container.querySelectorAll("[data-lens]").forEach(el => {
    el.addEventListener("click", () => {
      const li = Number(el.getAttribute("data-lens"));
      state.lensIdx = (state.lensIdx === li) ? null : li;
      renderAll();
    });
  });
}

function renderRankings(rowsBase, stats, lensSvc) {
  const tabSeg = document.getElementById("rankTabSeg");
  tabSeg.innerHTML = "";
  [["lens", "tabLens"], ["camera", "tabCam"], ["outing", "tabOuting"]].forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.rankTab === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => {
      state.rankTab = v;
      if (v !== "lens" && state.rankSort === "usage") state.rankSort = "rate";
      renderRankings(rowsBase, stats, lensSvc);
    };
    tabSeg.appendChild(b);
  });

  const sortSeg = document.getElementById("rankSortSeg");
  sortSeg.innerHTML = "";
  const sortOpts = state.rankTab === "lens"
    ? [["rate", "sortRate"], ["usage", "sortUsage"], ["keepers", "sortKeepers"], ["shots", "sortShots"]]
    : [["rate", "sortRate"], ["keepers", "sortKeepers"], ["shots", "sortShots"]];
  sortOpts.forEach(([v, k]) => {
    const b = document.createElement("button");
    b.className = state.rankSort === v ? "active" : "";
    b.textContent = tr(k);
    b.onclick = () => { state.rankSort = v; renderRankings(rowsBase, stats, lensSvc); };
    sortSeg.appendChild(b);
  });

  document.getElementById("minSamplesSelect").value = String(state.minSamples);

  const list = [];
  if (state.rankTab === "lens") {
    lensSvc.items.forEach(it => {
      if (it.shots < state.minSamples) return;
      list.push(it);
    });
  } else {
    const srcMap = state.rankTab === "camera" ? stats.camMap : stats.outingsMap;
    srcMap.forEach((m, idx) => {
      if (m.shots < state.minSamples) return;
      let topFl = "-";
      let bestC = 0;
      m.focal.forEach((c, fl) => { if (c > bestC) { bestC = c; topFl = fl + "mm"; } });
      const name = state.rankTab === "camera" ? DATA.cameras[idx] : DATA.outings[idx].name;
      list.push({
        idx, name,
        shots: m.shots,
        keepers: m.keepers,
        rate: m.shots ? (m.keepers / m.shots * 100) : 0,
        avgStar: m.ratedCnt ? (m.starSum / m.ratedCnt).toFixed(1) : "-",
        topFocal: topFl
      });
    });
  }

  list.sort((a, b) => {
    if (state.rankSort === "usage" && state.rankTab === "lens") {
      return (b.qualifiedUsage ? 1 : 0) - (a.qualifiedUsage ? 1 : 0) || b.dayRate - a.dayRate || b.shotRate - a.shotRate || b.shots - a.shots;
    }
    if (state.rankSort === "rate") return b.rate - a.rate || b.keepers - a.keepers;
    if (state.rankSort === "keepers") return b.keepers - a.keepers || b.rate - a.rate;
    return b.shots - a.shots || b.keepers - a.keepers;
  });

  const wrap = document.getElementById("rankTableWrap");
  if (!list.length) {
    wrap.innerHTML = `<div class="empty-msg">${tr("noData")}</div>`;
    return;
  }
  const maxRate = Math.max(1, ...list.map(x => x.rate));
  const isLens = state.rankTab === "lens";

  let html = `<table><thead><tr>
    <th>#</th><th>${tr("colName")}</th>` +
    (isLens ? `<th>${tr("colServiceSpan")}</th><th class="num">${tr("colActiveUsage")}</th>` : ``) +
    `<th class="num">${tr("colShots")}</th>
    <th class="num">${tr("colKeepers")}</th><th class="num">${tr("colRate")}</th>
    <th class="num">${tr("colAvgStar")}</th><th class="num">${tr("colTopFocal")}</th>
  </tr></thead><tbody>`;

  list.slice(0, 60).forEach((item, i) => {
    const isAct = (isLens && state.lensIdx === item.idx)
      || (state.rankTab === "outing" && String(state.outing) === String(item.idx));
    const click = state.rankTab !== "camera";
    const pctW = Math.min(100, item.rate / maxRate * 100).toFixed(1);

    let lensCols = "";
    if (isLens) {
      const spanTxt = item.firstDate === item.lastDate
        ? item.firstDate.slice(2)
        : (item.firstDate.slice(2, 7) + " ~ " + item.lastDate.slice(2, 7));
      const stLbl = tr("status_" + item.status);
      const tip = escHtml(tr("spanTipFmt", item.firstDate, item.lastDate, item.usedDays, item.spanDays, item.dayRate.toFixed(1), item.shotRate.toFixed(1), item.afterDays));
      const usageCell = item.usedDays <= 1
        ? `<span style="color:var(--text-dim)">${tr("trialBadge")}</span>`
        : `<div class="rate-bar" data-tip="${tip}">
             <div class="rate-track"><div class="rate-fill" style="width:${item.dayRate.toFixed(1)}%"></div></div>
             <span>${item.dayRate.toFixed(1)}%</span>
           </div>`;
      lensCols = `<td data-tip="${tip}"><span style="font-family:var(--mono);font-size:0.78rem;color:var(--text-muted);margin-right:6px">${spanTxt}</span><span class="status-badge st-${item.status}">${escHtml(stLbl)}</span></td>
        <td class="num">${usageCell}</td>`;
    }

    html += `<tr class="${click ? "clickable-row" : ""} ${isAct ? "active-row" : ""}" data-ridx="${item.idx}">
      <td style="color:var(--text-dim);font-family:var(--mono)">${i + 1}</td>
      <td style="font-weight:600">${escHtml(item.name)}</td>
      ${lensCols}
      <td class="num">${item.shots.toLocaleString()}</td>
      <td class="num" style="color:var(--accent-2);font-weight:700">${item.keepers.toLocaleString()}</td>
      <td class="num">
        <div class="rate-bar">
          <div class="rate-track"><div class="rate-fill" style="width:${pctW}%"></div></div>
          <span>${item.rate.toFixed(1)}%</span>
        </div>
      </td>
      <td class="num">${item.avgStar}</td>
      <td class="num" style="color:var(--text-muted)">${item.topFocal}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  wrap.innerHTML = html;
  bindTip(wrap);

  if (state.rankTab !== "camera") {
    wrap.querySelectorAll("tr[data-ridx]").forEach(trEl => {
      trEl.addEventListener("click", () => {
        const idx = Number(trEl.getAttribute("data-ridx"));
        if (state.rankTab === "lens") {
          state.lensIdx = (state.lensIdx === idx) ? null : idx;
        } else if (state.rankTab === "outing") {
          state.outing = (String(state.outing) === String(idx)) ? "ALL" : String(idx);
          state.dateStr = null;
        }
        renderAll();
      });
    });
  }
}

function renderOrient(rows) {
  const ori = [{ shots: 0, keepers: 0 }, { shots: 0, keepers: 0 }, { shots: 0, keepers: 0 }];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const k = isKeeper(r, state.thresh);
    if (r[10] >= 0 && r[10] <= 2) {
      ori[r[10]].shots++;
      if (k) ori[r[10]].keepers++;
    }
  }
  const oTotal = ori[0].shots + ori[1].shots + ori[2].shots;
  const ow = document.getElementById("orientWrap");
  if (!oTotal) {
    ow.innerHTML = `<div class="empty-msg">${tr("noData")}</div>`;
    return;
  }
  const p0 = (ori[0].shots / oTotal * 100).toFixed(1);
  const p1 = (ori[1].shots / oTotal * 100).toFixed(1);
  const p2 = (ori[2].shots / oTotal * 100).toFixed(1);
  const r0 = ori[0].shots ? (ori[0].keepers / ori[0].shots * 100) : 0;
  const r1 = ori[1].shots ? (ori[1].keepers / ori[1].shots * 100) : 0;
  const maxOrientRate = Math.max(10, r0, r1, ori[2].shots ? (ori[2].keepers / ori[2].shots * 100) : 0);
  const box = (lbl, o, pct) => {
    const rate = o.shots ? (o.keepers / o.shots * 100) : 0;
    const fillW = Math.min(100, rate / maxOrientRate * 100).toFixed(1);
    return `<div class="orient-box">
      <div class="lbl">${lbl}</div>
      <div class="big">${pct}%</div>
      <div style="font-size:0.74rem;color:var(--text-muted)">${o.shots.toLocaleString()} · <span style="color:var(--accent-2);font-weight:600">${rate.toFixed(1)}%</span></div>
      <div class="orient-mini-track"><div class="orient-mini-fill" style="width:${fillW}%"></div></div>
    </div>`;
  };
  let insightHtml = "";
  if (ori[0].shots >= 5 && ori[1].shots >= 5) {
    const diff = r1 - r0;
    const txt = Math.abs(diff) < 0.5 ? tr("orientTie")
      : diff > 0 ? tr("orientLeadPort", diff.toFixed(1))
      : tr("orientLeadLand", (-diff).toFixed(1));
    insightHtml = `<div class="orient-insight">${escHtml(txt)}</div>`;
  }
  ow.innerHTML = `
    <div class="orient-bar">
      <div style="width:${p0}%;background:var(--accent)"></div>
      <div style="width:${p1}%;background:var(--accent-2)"></div>
      <div style="width:${p2}%;background:var(--text-muted)"></div>
    </div>
    <div class="orient-grid">
      ${box(tr("landscape"), ori[0], p0)}
      ${box(tr("portrait"), ori[1], p1)}
      ${box(tr("square"), ori[2], p2)}
    </div>
    ${insightHtml}
  `;
}

function renderHourChart(rows) {
  const hCounts = Array.from({ length: 24 }, (_, h) => ({
    label: String(h).padStart(2, "0"),
    title: String(h).padStart(2, "0") + ":00 - " + String(h).padStart(2, "0") + ":59",
    shots: 0, keepers: 0, rate: 0
  }));
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const h = r[1];
    if (h >= 0 && h < 24) {
      hCounts[h].shots++;
      if (isKeeper(r, state.thresh)) hCounts[h].keepers++;
    }
  }
  hCounts.forEach(c => { c.rate = c.shots ? (c.keepers / c.shots * 100) : 0; });
  renderDualAxisBars(document.getElementById("hourChart"), hCounts, {
    width: 650, height: 235,
    bandsHtml: (padL, padT, pw, ph, step) => {
      const b1x = padL + 5 * step, b1w = 3 * step;
      const b2x = padL + 17 * step, b2w = 3 * step;
      return `
        <rect x="${b1x}" y="${padT}" width="${b1w}" height="${ph}" fill="var(--accent-2)" opacity="0.08"/>
        <text x="${b1x + b1w / 2}" y="${padT + 12}" text-anchor="middle" font-size="9.5" fill="var(--accent-2)">${tr("dawnBand")}</text>
        <rect x="${b2x}" y="${padT}" width="${b2w}" height="${ph}" fill="var(--accent)" opacity="0.08"/>
        <text x="${b2x + b2w / 2}" y="${padT + 12}" text-anchor="middle" font-size="9.5" fill="var(--accent)">${tr("sunsetBand")}</text>
      `;
    }
  });
}

function buildPersonaSummary(rows, stats) {
  const tags = [];
  let goldenCount = 0, goldenKeep = 0, portCount = 0, landCount = 0, orientTotal = 0, weekendCount = 0;
  const gearTypes = new Set();

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const k = isKeeper(r, state.thresh);
    gearTypes.add(r[5]);
    if ((r[1] >= 5 && r[1] <= 7) || (r[1] >= 17 && r[1] <= 19)) { goldenCount++; if (k) goldenKeep++; }
    if (r[10] <= 2) {
      orientTotal++;
      if (r[10] === 1) portCount++;
      if (r[10] === 0) landCount++;
    }
    const dt = new Date(DATA.dates[r[0]] + "T12:00:00Z");
    const dow = dt.getUTCDay();
    if (dow === 0 || dow === 6) weekendCount++;
  }

  if (stats.topFocal) {
    tags.push(state.lang === "zh" ? `${stats.topFocal}mm 本命视角` : `${stats.topFocal}mm Signature`);
  }
  if (stats.rate >= 25 && stats.total >= 50) {
    tags.push(state.lang === "zh" ? "稳准出片手" : "Precision Keeper");
  }
  if (goldenCount >= 10 && (goldenKeep / goldenCount) * 100 > stats.rate * 1.1) {
    tags.push(state.lang === "zh" ? "黄金时刻捕手" : "Golden Hour Hunter");
  }
  if (orientTotal > 20 && portCount / orientTotal >= 0.42) {
    tags.push(state.lang === "zh" ? "竖构图叙事者" : "Portrait Storyteller");
  } else if (orientTotal > 20 && landCount / orientTotal >= 0.72) {
    tags.push(state.lang === "zh" ? "横屏电影感玩家" : "Widescreen Framer");
  }
  if (rows.length > 20 && weekendCount / rows.length >= 0.52) {
    tags.push(state.lang === "zh" ? "周末特种兵" : "Weekend Explorer");
  }
  if (gearTypes.size >= 2) {
    tags.push(state.lang === "zh" ? "多机位创作者" : "Multi-Gear Creator");
  }
  if (!tags.length) {
    tags.push(state.lang === "zh" ? "全能光影记录者" : "Versatile Visual Chronicler");
  }

  const hShots = new Array(24).fill(0);
  const hKeep = new Array(24).fill(0);
  rows.forEach(r => { hShots[r[1]]++; if (isKeeper(r, state.thresh)) hKeep[r[1]]++; });
  let bestH = 17, bestHK = -1;
  for (let h = 0; h < 24; h++) {
    if (hKeep[h] > bestHK || (hKeep[h] === bestHK && hShots[h] > hShots[bestH])) { bestHK = hKeep[h]; bestH = h; }
  }
  const scopeParts = [];
  if (state.year !== "ALL") scopeParts.push(state.year);
  if (state.month !== "ALL") scopeParts.push(state.month + (state.lang === "zh" ? "月" : ""));
  if (state.outing !== "ALL") scopeParts.push(DATA.outings[Number(state.outing)].name);
  if (state.lensIdx !== null) scopeParts.push(lensDisplay(state.lensIdx));
  if (state.dateStr !== null) scopeParts.push(state.dateStr);
  const scopeLabel = scopeParts.length ? scopeParts.join(" · ") : tr("wScopeAll");

  return {
    scopeLabel,
    tags: tags.slice(0, 5),
    topFocal: stats.topFocal ? `${stats.topFocal}mm` : "-",
    mvpGear: stats.mvpLens ? lensDisplay(stats.mvpLens.idx) : "-",
    peakOuting: stats.peakOuting ? DATA.outings[stats.peakOuting.idx].name : "-",
    goldenWindow: `${String(bestH).padStart(2, "0")}:00 - ${String((bestH + 1) % 24).padStart(2, "0")}:00`
  };
}
